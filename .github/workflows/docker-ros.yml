name: docker-ros

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-ros:
    runs-on: ubuntu-latest
    steps:
      - uses: ika-rwth-aachen/docker-ros@main
        with:
          platform: amd64
          target: dev,run
          base-image: rwthika/ros2:jazzy
          rmw-implementation: rmw_zenoh_cpp
          command: ros2 launch autonomy_benchmarks autonomy_benchmarks.launch.py
          enable-slim: false
        env:
          TARGET_CMAKE_ARGS: -DCMAKE_EXPORT_COMPILE_COMMANDS=1
      - name: Compute dev image ref
        id: devimg
        run: |
          NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SLUG="$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g; s/^-//; s/-$//')"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}-dev"
          elif [[ "$GITHUB_REF_NAME" == "${{ github.event.repository.default_branch }}" ]]; then
            TAG="latest-dev"
          else
            TAG="latest-dev_${SLUG}_ci"
          fi
          echo "Using dev test image '${NAME}:${TAG}'"
          echo "image=${NAME}:${TAG}" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: |
          docker run --rm -u root:root \
            "${{ steps.devimg.outputs.image }}" \
            bash -ic '
              PACKAGES=$(colcon list --base-paths /docker-ros/ws/src/target --names-only) &&
              colcon build --symlink-install --packages-up-to $PACKAGES &&
              colcon test --packages-select $PACKAGES
              colcon test-result --verbose
            '
