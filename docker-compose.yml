name: ${USER}-autonomy-benchmarks

services:

  autonomy_datasets:
    image: ghcr.io/thinking-cars/autonomy_datasets:latest_benchmark_ci
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch autonomy_datasets autonomy_datasets.launch.py dataset:=$${DATASET} rviz:=yes wait_for_ack:=true loop:=yes
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      DISPLAY: ${DISPLAY:-""}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      DATASET: ${DATASET:-nuscenes}  # nuscenes, waymo_open_dataset, nvidia_physicalai_av_dataset
    volumes:
      - ./config.rviz:/docker-ros/ws/install/autonomy_datasets/share/autonomy_datasets/config/config.rviz
      - ${DATASET_DIR}:/datasets
      - /tmp/.X11-unix:/tmp/.X11-unix
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  autonomy_benchmarks_object_tracking:
    depends_on:
      - autonomy_datasets
    image: ghcr.io/thinking-cars/autonomy_benchmarks-internal:latest_init_ci
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch autonomy_benchmarks benchmark_object_tracking.launch.py \
          benchmark:=nuscenes_object_tracking \
          objects_tracked:=/object_list/lidar_01 \
          objects_truth:=/object_list/lidar_01

  autoware_multi_object_tracker:
    depends_on:
      - autonomy_datasets
    image: ghcr.io/thinking-cars/autoware_multi_object_tracker:latest_init_ci
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      INPUT_DETECTION01_OBJECTS: /object_list/lidar_01
      INPUT_DETECTION01_CHANNEL: detected_objects
      OUTPUT_OBJECTS: /object_list/tracked_objects
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch autoware_multi_object_tracker multi_object_tracker.launch.xml \
          input/detection01/objects:=$${INPUT_DETECTION01_OBJECTS} \
          input/detection01/channel:=$${INPUT_DETECTION01_CHANNEL} \
          output/objects:=$${OUTPUT_OBJECTS}
