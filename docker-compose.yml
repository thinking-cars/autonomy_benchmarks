services:

  zenoh-router:
    image: ghcr.io/thinking-cars/autonomy_datasets:latest_init_ci
    command: ros2 run rmw_zenoh_cpp rmw_zenohd
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_CONFIG_OVERRIDE: listen/endpoints=["tcp/[::]:7447"];transport/shared_memory/enabled=true
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/7447"]
      interval: 1s
      timeout: 1s
      retries: 5
    ipc: shareable
    shm_size: 4gb
    ulimits:
      memlock:
        soft: 4294967296
        hard: 4294967296

  autonomy_datasets:
    image: ghcr.io/thinking-cars/autonomy_datasets:latest_init_ci
    command: ros2 launch autonomy_datasets autonomy_datasets.launch.py rviz:=yes dataset:=nuscenes
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_CONFIG_OVERRIDE: mode="client";connect/endpoints=["tcp/zenoh-router:7447"];transport/shared_memory/enabled=true
      DISPLAY: ${DISPLAY}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $DATASET_DIR:/datasets
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: service:zenoh-router
    ulimits:
      memlock:
        soft: 4294967296
        hard: 4294967296
  
  autonomy_benchmarks:
    image: ghcr.io/thinking-cars/autonomy_benchmarks-internal:latest_init_ci
    command: ros2 launch autonomy_benchmarks autonomy_benchmarks.launch.py benchmark:=nuscenes_lidar_object_detection
    environment:
      RMW_IMPLEMENTATION: rmw_zenoh_cpp
      ZENOH_CONFIG_OVERRIDE: mode="client";connect/endpoints=["tcp/zenoh-router:7447"];transport/shared_memory/enabled=true
    ipc: service:zenoh-router
    ulimits:
      memlock:
        soft: 4294967296
        hard: 4294967296
